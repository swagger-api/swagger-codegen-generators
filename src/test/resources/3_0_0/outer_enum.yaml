openapi: 3.0.0
info:
  title: Outer enum generation
  version: 1.0.0
paths:
  /orders/{orderId}/status:
    get:
      operationId: getOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatus'
components:
  schemas:
    OrderStatus:
      type: string
      description: Status of the order
      enum:
        - placed
        - approved
        - delivered
    Order:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/OrderStatus'
